    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Navigation Bar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(90deg, #F2A65A, #E5484D);
      padding: 14px 22px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease;
    }

    .navbar a:hover {
      opacity: 0.8;
    }
